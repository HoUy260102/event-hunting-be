server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: event
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
  data:
    web:
      page-serialization-mode: via-dto

app:
  api-base-url: ${APP_API_BASE_URL:http://localhost:8080/api/v1}

logging:
  charset:
    console: UTF-8
  pattern:
    correlation: "[%X{requestId:-}] "


