server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: event
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
  data:
    web:
      page-serialization-mode: via-dto

app:
  api-base-url: ${APP_API_BASE_URL:http://localhost:8080/api/v1}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  captcha:
    enabled: ${CAPTCHA_ENABLED:false}
    secret-key: ${CAPTCHA_SECRET_KEY:}
    bypass-token: ${CAPTCHA_BYPASS_TOKEN:DEV_BYPASS_TOKEN}
  cleanup:
    pending-hours: ${APP_CLEANUP_PENDING_HOURS:3}
    uploaded-hours: ${APP_CLEANUP_UPLOADED_HOURS:24}
    deleted-days: ${APP_CLEANUP_DELETED_DAYS:30}

ticket:
  queue:
    max-buying: ${TICKET_QUEUE_MAX_BUYING:50}

gemini:
  api-key: ${GEMINI_API_KEY:}
  embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}

qdrant:
  url: ${QDRANT_URL:http://localhost:6333}
  api-key: ${QDRANT_API_KEY:}
  collection-name: ${QDRANT_COLLECTION:events}

logging:
  charset:
    console: UTF-8
  pattern:
    correlation: "[%X{requestId:-}] "


